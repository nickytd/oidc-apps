name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.5.2)'
        required: true

# Serialize releases per target version; never cancel an in-flight release.
# On workflow_dispatch github.ref is the branch, so key on the tag input when present.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version from tag or input
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package and push Helm chart
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          helm package charts/oidc-apps \
            --version "${VERSION#v}" \
            --app-version "${VERSION}"
          helm push oidc-apps-*.tgz oci://ghcr.io/nickytd/oidc-apps/charts

  build:
    name: Build image (${{ matrix.suffix }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push oidc-apps (${{ matrix.suffix }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.oidc-apps
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/nickytd/oidc-apps/oidc-apps:${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Build and push kube-rbac-proxy (${{ matrix.suffix }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.watcher
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/nickytd/oidc-apps/kube-rbac-proxy:${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: false
          sbom: false

  manifest:
    name: Publish multi-arch manifests
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push multi-arch manifests
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          for IMG in oidc-apps kube-rbac-proxy; do
            REPO="ghcr.io/nickytd/oidc-apps/${IMG}"
            docker buildx imagetools create \
              --tag "${REPO}:${VERSION}" \
              --tag "${REPO}:latest" \
              "${REPO}:${VERSION}-amd64" \
              "${REPO}:${VERSION}-arm64"
          done

  release:
    name: Create GitHub Release
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
